name: Release APK

# Push a tag (e.g. `git tag 0.1 && git push origin 0.1`) and this workflow:
#   1. installs, typechecks and runs the full test suite (TST gate)
#   2. builds the production PWA bundle and syncs it into the Android project
#   3. assembles a signed release APK
#   4. creates (or updates) the GitHub Release for that tag and attaches the
#      APK + its SHA-256 checksum to it.
#
# Signing: provide the optional repository secrets below to sign with your own
# key — REQUIRED if you want users to be able to upgrade an installed app to a
# later release (Android needs the same signature for every upgrade). Without
# them an ephemeral throwaway key is generated for this run.

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Tests
        run: npm test

      - name: Production bundle
        run: npm run build

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # ------------------------------------------------------------- version
      - name: Derive version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJ="$(echo "$TAG" | cut -d. -f1)"
          MIN="$(echo "$TAG" | cut -d. -f2)"
          PAT="$(echo "$TAG" | cut -d. -f3)"
          [[ "$MAJ" =~ ^[0-9]+$ ]] || MAJ=0
          [[ "$MIN" =~ ^[0-9]+$ ]] || MIN=0
          [[ "$PAT" =~ ^[0-9]+$ ]] || PAT=0
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          [ "$CODE" -lt 1 ] && CODE=1
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Stocker $TAG (versionCode $CODE)"

      # ------------------------------------------------------------ signing
      - name: Prepare the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/stocker.keystore"
            {
              echo "STOCKER_KEYSTORE=$RUNNER_TEMP/keystore/stocker.keystore"
              echo "STOCKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "STOCKER_KEY_ALIAS=$KEY_ALIAS"
              echo "STOCKER_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository keystore secret."
          else
            # Ephemeral key: fine for test installs, but NOT for upgradable
            # releases — add the secrets above before sharing with users.
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/keystore/stocker.keystore" \
              -storepass stocker-release \
              -keypass stocker-release \
              -alias stocker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Stocker Release, O=Stocker, C=US"
            {
              echo "STOCKER_KEYSTORE=$RUNNER_TEMP/keystore/stocker.keystore"
              echo "STOCKER_KEYSTORE_PASSWORD=stocker-release"
              echo "STOCKER_KEY_ALIAS=stocker"
              echo "STOCKER_KEY_PASSWORD=stocker-release"
            } >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_* secrets set — this APK is signed with a throwaway key."
          fi

      - name: Assemble release APK
        env:
          STOCKER_VERSION_NAME: ${{ steps.ver.outputs.name }}
          STOCKER_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew assembleRelease --no-daemon --console=plain
        working-directory: android

      - name: Package APK + checksum
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Stocker-${GITHUB_REF_NAME}.apk"
          cd out
          sha256sum "Stocker-${GITHUB_REF_NAME}.apk" | tee "Stocker-${GITHUB_REF_NAME}.apk.sha256"

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.sha256
          generate_release_notes: true
          body: |
            **Stocker ${{ github.ref_name }}** — educational stock-trading simulator (virtual money, no real orders).

            - Install the attached `Stocker-${{ github.ref_name }}.apk` on Android (allow installs from unknown sources).
            - Verify the download: `sha256sum -c Stocker-${{ github.ref_name }}.apk.sha256`
            - On-device API key: bring your own free-tier Twelve Data / Finnhub / MarketData key (Settings → Provider).

            _Not financial advice. Not a broker. Data may be delayed._
