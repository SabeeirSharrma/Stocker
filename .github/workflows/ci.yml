name: CI

# Fast feedback on main: typecheck, tests, production bundle.
# (The tag workflow in release.yml runs this same gate before shipping an APK.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Tests (engine determinism, storage, reconstruction, UI)
        run: npm test

      - name: Production bundle
        run: npm run build
